<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إضافة البيانات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Noto Kufi Arabic', sans-serif; background-color: #f3f4f6; color: #1f2937; }
        .font-amiri { font-family: 'Amiri', serif; }
        .editor-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-family: 'Amiri', serif;
            font-size: 1rem;
            margin-top: 4px;
        }
        .editor-input:focus {
            outline: none;
            border-color: #059669;
            ring: 2px solid #059669;
        }
        .editor-label {
            font-weight: bold;
            font-size: 0.9rem;
            color: #047857;
        }
    </style>
</head>
<body>
    <div class="max-w-4xl mx-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">إدارة الأحاديث (Firestore)</h1>
            <a href="gs.html" class="text-emerald-600 hover:underline">العودة للرئيسية &larr;</a>
        </div>

        <div class="bg-white p-8 rounded-xl border border-gray-200 shadow-md">
            <h2 class="text-xl font-bold font-amiri text-center mb-6 text-gray-800">إضافة حديث جديد</h2>
            <div class="mb-4 p-4 bg-blue-50 text-blue-700 rounded-lg text-sm border border-blue-100">
                <strong>ملاحظة:</strong> البيانات المضافة هنا تُحفظ في قاعدة بيانات Firestore. إذا كانت الإضافة (Algolia Extension) مفعلة في مشروعك، فسيتم نقل البيانات تلقائياً لمحرك البحث.
            </div>

            <form id="gnv-form" onsubmit="saveToFirestore(event)">
                <div class="space-y-4">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="editor-label">رقم الحديث (ID)</label>
                            <input type="text" id="inp-custom-id" class="editor-input" placeholder="رقم مميز (مثلاً 12345)">
                        </div>
                         <div>
                            <label class="editor-label">الصفحة / الرقم</label>
                            <input type="text" id="inp-page" class="editor-input">
                        </div>
                    </div>

                    <div>
                        <label class="editor-label">نص الحديث</label>
                        <textarea id="inp-text" rows="5" class="editor-input" required></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="editor-label">الراوي (افصل بفاصلة)</label>
                            <input type="text" id="inp-rawi" class="editor-input">
                        </div>
                         <div>
                            <label class="editor-label">المحدث</label>
                            <input type="text" id="inp-muhaddith" class="editor-input">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="editor-label">الحكم</label>
                            <input type="text" id="inp-hukm" class="editor-input">
                        </div>
                        <div>
                            <label class="editor-label">المصدر</label>
                            <input type="text" id="inp-source" class="editor-input">
                        </div>
                    </div>

                    <div>
                        <label class="editor-label">التصنيفات (افصل بفاصلة)</label>
                        <input type="text" id="inp-categories" class="editor-input">
                    </div>

                    <div>
                        <label class="editor-label">التخريج</label>
                        <textarea id="inp-takhrij" rows="2" class="editor-input"></textarea>
                    </div>

                    <div>
                        <label class="editor-label">الشرح</label>
                        <textarea id="inp-sharh" rows="6" class="editor-input"></textarea>
                    </div>

                    <div>
                        <label class="editor-label">أصل الحديث</label>
                        <textarea id="inp-osoul" rows="3" class="editor-input"></textarea>
                    </div>
                </div>

                <div class="flex gap-4 mt-8 justify-end">
                    <button type="reset" class="px-6 py-2 rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200">مسح</button>
                    <button type="submit" id="save-btn" class="px-8 py-2 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700 font-bold shadow-lg">حفظ البيانات</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBYJ2pVoWJ5ednWOnnF2dOJ43MJvDi_8rw",
            authDomain: "hadeth-7baf7.firebaseapp.com",
            projectId: "hadeth-7baf7",
            storageBucket: "hadeth-7baf7.firebasestorage.app",
            messagingSenderId: "401684715520",
            appId: "1:401684715520:web:297abdb6aee1fb3176a0e5",
            measurementId: "G-LGET278KWQ"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function saveToFirestore(e) {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            const originalText = btn.textContent;
            btn.textContent = 'جاري الحفظ...';
            btn.disabled = true;

            const parseArray = (val) => val ? val.split('،').join(',').split(',').map(s => s.trim()).filter(Boolean) : [];
            const customId = document.getElementById('inp-custom-id').value.trim();

            const data = {
                id: customId,
                text: document.getElementById('inp-text').value,
                rawi: parseArray(document.getElementById('inp-rawi').value),
                muhaddith: document.getElementById('inp-muhaddith').value,
                hukm: document.getElementById('inp-hukm').value,
                source: document.getElementById('inp-source').value,
                page_or_number: document.getElementById('inp-page').value,
                takhrij: document.getElementById('inp-takhrij').value,
                sharh: document.getElementById('inp-sharh').value,
                osoul: document.getElementById('inp-osoul').value,
                categories: parseArray(document.getElementById('inp-categories').value),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                if (customId) {
                    // Use custom ID as Document ID
                    await db.collection('hadiths').doc(customId).set(data, { merge: true });
                } else {
                    // Auto-generate ID
                    await db.collection('hadiths').add(data);
                }
                alert('تم حفظ البيانات بنجاح في Firestore!');
                document.getElementById('gnv-form').reset();
            } catch (error) {
                console.error("Error writing document: ", error);
                alert('فشل الحفظ: ' + error.message);
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
