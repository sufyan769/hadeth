<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>السيرة النبوية - عرض المخطوطة</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-page: #f9f7f2;
            --sidebar-width: 320px;
            --accent: #2980b9;
            --text-main: #2c3e50;
            --border: #e0dcd0;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Amiri', serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        #sidebar {
            width: var(--sidebar-width);
            background: #f1ede4;
            border-left: 1px solid var(--border);
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            z-index: 1000;
            overflow: hidden;
        }

        #sidebar.collapsed {
            width: 0;
            border-left: none;
        }

        .sidebar-header {
            padding: 25px;
            border-bottom: 2px solid var(--border);
            background: rgba(0, 0, 0, 0.02);
        }

        #sidebar-data {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }

        #sidebar-data h3 {
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            margin: 20px 0 10px;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        #sidebar-data ul {
            list-style: none;
        }

        #sidebar-data li {
            padding: 12px 15px;
            margin-bottom: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.05rem;
            transition: var(--transition);
            color: #5d4d42;
        }

        #sidebar-data li.active {
            background: var(--accent);
            color: white;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .top-nav {
            padding: 10px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            z-index: 100;
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-icon {
            background: white;
            border: 1px solid var(--border);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .mode-btn {
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.9rem;
            background: #eeeae0;
            color: #8d8479;
        }

        .mode-btn.active {
            background: var(--accent);
            color: white;
        }

        .scroll-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }

        .manuscript-page {
            max-width: 850px;
            margin: 20px auto 40px;
            background: white;
            min-height: calc(100% - 100px);
            padding: 50px 70px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            position: relative;
        }

        #editable-content {
            font-size: 1.45rem;
            line-height: 2.1;
            color: #34495e;
            text-align: justify;
            outline: none;
        }

        .footer-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .nav-btn {
            background: #f1ede4;
            border: 1px solid var(--border);
            padding: 12px 25px;
            border-radius: 12px;
            font-family: 'Tajawal', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--accent);
            color: white;
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Tooltip adjusted for iPad (Fixed positioning) */
        #smart-tooltip {
            position: fixed;
            /* Crucial for iPad coordinates */
            z-index: 10000;
            background-color: #333;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            max-width: 280px;
            font-size: 0.95em;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            display: none;
            text-align: right;
            line-height: 1.6;
        }

        #smart-tooltip img {
            max-width: 100%;
            border-radius: 4px;
            margin-bottom: 8px;
            display: block;
        }

        .smart-link {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 2px solid rgba(41, 128, 185, 0.2);
            font-weight: bold;
            cursor: pointer;
        }

        #loader {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 10001;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .manuscript-page {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body class="user-page">

    <div id="loader">
        <div class="spinner"></div>
    </div>

    <aside id="sidebar" class="collapsed">
        <div class="sidebar-header">
            <h2 style="font-family: Tajawal;">فهرس الجزء</h2>
        </div>
        <div id="sidebar-data"></div>
    </aside>

    <main>
        <nav class="top-nav">
            <div class="nav-group">
                <button class="btn-icon" id="toggle-sidebar">📚</button>
                <div class="mode-btn-group"
                    style="display: flex; gap: 5px; background: #eeeae0; padding: 4px; border-radius: 12px;">
                    <button class="mode-btn active" data-mode="read">قراءة</button>
                    <button class="mode-btn" data-mode="edit">تعديل</button>
                </div>
            </div>
            <div class="nav-group">
                <button class="btn-icon" onclick="document.getElementById('file-input').click()">📂</button>
                <button class="btn-icon" id="export-btn">💾</button>
            </div>
        </nav>

        <div class="scroll-container">
            <article class="manuscript-page">
                <div id="editable-content" contenteditable="false">
                    <div style="text-align: center; margin-top: 20vh; opacity: 0.5;">
                        <h1 style="font-family: Tajawal;">سيرة المصطفى ﷺ</h1>
                        <p style="margin-top: 10px;">يرجى رفع ملف البيانات للبدء</p>
                    </div>
                </div>

                <div class="footer-nav">
                    <button id="prev-btn" class="nav-btn" disabled>السابق ⬅️</button>
                    <button id="next-btn" class="nav-btn">التالي ➡️</button>
                </div>
            </article>
        </div>
    </main>

    <div id="smart-tooltip">
        <div id="tooltip-content"></div>
    </div>

    <input type="file" id="file-input" style="display: none;" accept=".json">

    <script>
        const STORAGE_KEYS = {
            sidebar: 'sira_sidebar_html',
            events: 'sira_events_content',
            tarajim: 'sira_tarajim_data'
        };

        const elements = {
            sidebar: document.getElementById('sidebar-data'),
            content: document.getElementById('editable-content'),
            tooltip: document.getElementById('smart-tooltip'),
            tooltipContent: document.getElementById('tooltip-content'),
            scrollContainer: document.querySelector('.scroll-container'),
            sidebarParent: document.getElementById('sidebar')
        };

        let eventsCache = {};
        let tarajimData = {};
        let currentMode = 'read';

        function init() {
            const storedSidebar = localStorage.getItem(STORAGE_KEYS.sidebar);
            eventsCache = JSON.parse(localStorage.getItem(STORAGE_KEYS.events) || '{}');
            tarajimData = JSON.parse(localStorage.getItem(STORAGE_KEYS.tarajim) || '{}');

            if (storedSidebar) {
                elements.sidebar.innerHTML = storedSidebar;
                const first = elements.sidebar.querySelector('li[data-event-id]');
                if (first) loadEvent(first);
            }

            document.getElementById('loader').style.display = 'none';
            bindEvents();
        }

        function bindEvents() {
            document.getElementById('toggle-sidebar').onclick = (e) => {
                e.stopPropagation();
                elements.sidebarParent.classList.toggle('collapsed');
            };

            elements.sidebar.onclick = (e) => {
                const li = e.target.closest('li[data-event-id]');
                if (li && currentMode === 'read') loadEvent(li);
            };

            elements.scrollContainer.onclick = (e) => {
                if (currentMode === 'read' && !e.target.closest('.nav-btn')) {
                    elements.sidebarParent.classList.add('collapsed');
                }
            };

            document.getElementById('next-btn').onclick = () => navigate(1);
            document.getElementById('prev-btn').onclick = () => navigate(-1);

            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.onclick = () => {
                    currentMode = btn.dataset.mode;
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    elements.content.contentEditable = (currentMode === 'edit');
                };
            });

            document.getElementById('file-input').onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const b = JSON.parse(ev.target.result);
                    if (b.sidebar) localStorage.setItem(STORAGE_KEYS.sidebar, b.sidebar);
                    if (b.events) localStorage.setItem(STORAGE_KEYS.events, JSON.stringify(typeof b.events === 'string' ? JSON.parse(b.events) : b.events));
                    if (b.links || b.tarajim) localStorage.setItem(STORAGE_KEYS.tarajim, JSON.stringify(b.links || b.tarajim));
                    location.reload();
                };
                reader.readAsText(file);
            };

            document.getElementById('export-btn').onclick = () => {
                const blob = new Blob([JSON.stringify({
                    sidebar: elements.sidebar.innerHTML,
                    events: eventsCache,
                    links: tarajimData
                })], { type: 'application/json' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'sira_backup.json'; a.click();
            };

            // --- UNIFIED TOOLTIP LOGIC FOR IPAD ---

            // 1. Mouse support for laptop
            elements.content.addEventListener('mousemove', (e) => {
                if (currentMode !== 'read') return;
                const link = e.target.closest('.smart-link, a[data-link-id]');
                if (link) {
                    showTooltip(link);
                    positionTooltip(e.clientX, e.clientY);
                } else {
                    hideTooltip();
                }
            });

            // 2. Tap support for iPad
            elements.content.addEventListener('click', (e) => {
                if (currentMode !== 'read') return;
                const link = e.target.closest('.smart-link, a[data-link-id]');
                if (link) {
                    e.preventDefault(); e.stopPropagation();
                    showTooltip(link);
                    const r = link.getBoundingClientRect();
                    positionTooltip(r.left, r.bottom + 10);
                } else {
                    hideTooltip();
                }
            });

            // Hide when scrolling or clicking away
            elements.scrollContainer.addEventListener('scroll', hideTooltip);
            document.body.addEventListener('click', (e) => {
                if (!e.target.closest('.smart-link, a[data-link-id]')) hideTooltip();
            }, true);
        }

        function loadEvent(li) {
            const id = li.dataset.eventId;
            elements.sidebar.querySelectorAll('li').forEach(l => l.classList.remove('active'));
            li.classList.add('active');
            elements.content.innerHTML = eventsCache[id] || '<p>المحتوى غير متوفر لهذه الصفحة.</p>';
            elements.scrollContainer.scrollTop = 0;
            elements.sidebarParent.classList.add('collapsed');
            updateNavButtons();
        }

        function navigate(dir) {
            const lis = Array.from(elements.sidebar.querySelectorAll('li[data-event-id]'));
            const active = elements.sidebar.querySelector('li.active');
            const idx = lis.indexOf(active);
            const next = lis[idx + dir];
            if (next) loadEvent(next);
        }

        function updateNavButtons() {
            const lis = Array.from(elements.sidebar.querySelectorAll('li[data-event-id]'));
            const active = elements.sidebar.querySelector('li.active');
            const idx = lis.indexOf(active);
            document.getElementById('prev-btn').disabled = (idx <= 0);
            document.getElementById('next-btn').disabled = (idx >= lis.length - 1);
        }

        function showTooltip(link) {
            const lid = link.dataset.linkId;
            const txt = link.textContent.trim();
            let data = tarajimData[lid];
            if (!data) {
                for (let k in tarajimData) {
                    if (tarajimData[k].العنوان === txt || tarajimData[k].كلمة_مفتاحية === txt) {
                        data = tarajimData[k]; break;
                    }
                }
            }
            if (!data) return;
            let h = '';
            if (data.صورة) h += `<img src="${data.صورة}">`;
            if (data.العنوان) h += `<strong>${data.العنوان}</strong><br>`;
            if (data.المحتوى || data.المحوى) h += data.المحتوى || data.المحوى;
            elements.tooltipContent.innerHTML = h;
            elements.tooltip.style.display = 'block';
        }

        function positionTooltip(x, y) {
            const offset = 15;
            let finalX = x + offset;
            let finalY = y + offset;
            const pW = elements.tooltip.offsetWidth || 280;
            const pH = elements.tooltip.offsetHeight || 100;
            if (finalX + pW > window.innerWidth) finalX = window.innerWidth - pW - 10;
            if (finalY + pH > window.innerHeight) finalY = y - pH - 15;
            if (finalX < 10) finalX = 10;
            elements.tooltip.style.left = finalX + 'px';
            elements.tooltip.style.top = finalY + 'px';
        }

        function hideTooltip() { elements.tooltip.style.display = 'none'; }

        init();
    </script>
</body>

</html>
