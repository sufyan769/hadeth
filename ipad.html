<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="السيرة">
    <title>السيرة النبوية - عرض المخطوطة</title>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3342/3342137.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Outfit:wght@300;400;600&family=Tajawal:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-page: #f9f7f2;
            --bg-card: #ffffff;
            --sidebar-width: 320px;
            --accent: #2980b9;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border: #e0dcd0;
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Amiri', serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Sidebar similar to user.js logic elements */
        #sidebar {
            width: var(--sidebar-width);
            background: #f1ede4;
            border-left: 1px solid var(--border);
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            z-index: 1000;
            overflow: hidden;
        }

        #sidebar.collapsed {
            width: 0;
            border-left: none;
            pointer-events: none;
        }

        .sidebar-header {
            padding: 25px;
            border-bottom: 2px solid var(--border);
            background: rgba(0, 0, 0, 0.02);
            flex-shrink: 0;
        }

        .sidebar-header h2 {
            font-family: 'Tajawal', sans-serif;
            font-size: 1.1rem;
            color: #5d4037;
            white-space: nowrap;
        }

        #sidebar-data {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }

        #sidebar-data h3 {
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            margin: 20px 0 10px;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
            white-space: nowrap;
        }

        #sidebar-data ul {
            list-style: none;
        }

        #sidebar-data li {
            padding: 12px 15px;
            margin-bottom: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.05rem;
            transition: var(--transition);
            color: #5d4d42;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #sidebar-data li:hover,
        #sidebar-data li.active {
            background: var(--accent);
            color: white;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: var(--transition);
            background: radial-gradient(circle at center, #ffffff 0%, #f9f7f2 100%);
            position: relative;
        }

        .top-nav {
            padding: 10px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            z-index: 100;
            min-height: 65px;
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-icon {
            background: white;
            border: 1px solid var(--border);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: var(--transition);
            z-index: 101;
        }

        .btn-icon:active {
            background: #eee;
            transform: scale(0.95);
        }

        .mode-switcher {
            display: flex;
            background: #eeeae0;
            padding: 4px;
            border-radius: 12px;
        }

        .mode-btn {
            border: none;
            padding: 6px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            background: transparent;
            color: #8d8479;
        }

        .mode-btn.active {
            background: white;
            color: var(--accent);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .btn-save {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .scroll-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }

        .manuscript-page {
            max-width: 850px;
            margin: 20px auto 30px;
            background: white;
            min-height: calc(100% - 80px);
            padding: 50px 70px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            transition: var(--transition);
        }

        /* The main content area matching user.js elements */
        #editable-content {
            font-size: 1.45rem;
            line-height: 2.1;
            color: #34495e;
            text-align: justify;
        }

        #editable-content[contenteditable="true"] {
            outline: none;
            border-right: 4px solid var(--accent);
            padding-right: 20px;
        }

        /* Tooltip from user.js / style.css */
        #smart-tooltip {
            position: absolute;
            z-index: 10000;
            background-color: #333;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            max-width: 250px;
            font-size: 0.9em;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            display: none;
            transition: opacity 0.2s;
            text-align: right;
        }

        #smart-tooltip img {
            max-width: 100%;
            border-radius: 4px;
            margin-bottom: 5px;
            display: block;
        }

        .smart-link {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 2px solid rgba(41, 128, 185, 0.2);
            font-weight: 700;
            cursor: pointer;
        }

        #toolbar {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            border: 1px solid var(--border);
            gap: 15px;
        }

        #toolbar button {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px 10px;
        }

        #loader {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 10001;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .manuscript-page {
                padding: 40px 20px;
                border-radius: 0;
                margin: 0;
            }

            .top-nav {
                padding: 10px 15px;
            }
        }
    </style>
</head>

<body class="user-page">

    <div id="loader">
        <div class="spinner"></div>
    </div>

    <aside id="sidebar" class="collapsed">
        <div class="sidebar-header">
            <h2>فهرس الجزء</h2>
        </div>
        <div id="sidebar-data"></div>
    </aside>

    <main>
        <nav class="top-nav">
            <div class="nav-group">
                <button class="btn-icon" id="toggle-sidebar">📚</button>
                <div class="mode-switcher">
                    <button class="mode-btn active" data-mode="read">قراءة</button>
                    <button class="mode-btn" data-mode="edit">تعديل</button>
                </div>
            </div>
            <div class="nav-group">
                <button class="btn-icon" onclick="document.getElementById('import-backup-input').click()">📂</button>
                <button class="btn-save" id="export-btn">💾 حفظ النسخة</button>
            </div>
        </nav>

        <div class="scroll-container">
            <article class="manuscript-page">
                <div class="editor-canvas">
                    <div id="editable-content" contenteditable="false">
                        <div style="text-align: center; margin-top: 20vh; opacity: 0.6;">
                            <h1 style="font-family: 'Tajawal';">سيرة المصطفى ﷺ</h1>
                            <p style="margin-top: 15px;">يرجى تحميل ملف البيانات للبدء</p>
                        </div>
                    </div>
                </div>
            </article>
        </div>
    </main>

    <div id="smart-tooltip">
        <div id="tooltip-content"></div>
    </div>

    <div id="toolbar">
        <button onclick="exec('bold')"><b>B</b></button>
        <button onclick="exec('italic')"><i>I</i></button>
        <button onclick="exec('underline')"><u>U</u></button>
        <button onclick="exec('insertOrderedList')">1.</button>
        <button onclick="exec('removeFormat')">🧹</button>
    </div>

    <input type="file" id="import-backup-input" style="display: none;" accept=".json">

    <script>
        // EXACT SAME LOGIC AS user.js
        const STORAGE_KEYS = {
            sidebar: 'sira_sidebar_html',
            events: 'sira_events_content',
            tarajim: 'sira_tarajim_data'
        };

        const elements = {
            sidebar: document.getElementById('sidebar-data'),
            content: document.getElementById('editable-content'),
            importInput: document.getElementById('import-backup-input'),
            tooltip: document.getElementById('smart-tooltip'),
            tooltipContent: document.getElementById('tooltip-content'),
            toggleSidebar: document.getElementById('toggle-sidebar'),
            sidebarParent: document.getElementById('sidebar')
        };

        let eventsCache = {};
        let tarajimData = {};
        let currentMode = 'read';

        function init() {
            loadInitialData();
            bindSidebarEvents();
            bindImport();
            setupModes();

            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
        }

        function readFromStorage(key, fallback) {
            const stored = localStorage.getItem(key);
            if (!stored) return fallback;
            try { return JSON.parse(stored); } catch (err) { return fallback; }
        }

        function loadInitialData() {
            const storedSidebar = localStorage.getItem(STORAGE_KEYS.sidebar);
            eventsCache = readFromStorage(STORAGE_KEYS.events, {});
            tarajimData = readFromStorage(STORAGE_KEYS.tarajim, {});

            if (storedSidebar && storedSidebar.trim()) {
                elements.sidebar.innerHTML = storedSidebar;
                activateInitialItem();
            }
        }

        function activateInitialItem() {
            const firstLi = elements.sidebar.querySelector('li[data-event-id]');
            if (firstLi) {
                activateSidebarItem(firstLi);
                loadEventContent(firstLi.dataset.eventId);
            }
        }

        function bindSidebarEvents() {
            elements.sidebar.addEventListener('click', (event) => {
                const li = event.target.closest('li[data-event-id]');
                if (!li || currentMode === 'edit') return;
                activateSidebarItem(li);
                loadEventContent(li.dataset.eventId);
            });

            elements.toggleSidebar.onclick = () => {
                elements.sidebarParent.classList.toggle('collapsed');
            };
        }

        function activateSidebarItem(li) {
            elements.sidebar.querySelectorAll('li').forEach((item) => item.classList.remove('active'));
            li.classList.add('active');
        }

        function loadEventContent(eventId) {
            const content = eventsCache && Object.prototype.hasOwnProperty.call(eventsCache, eventId)
                ? eventsCache[eventId]
                : '';
            elements.content.innerHTML = content || '<p>لا يوجد محتوى بعد.</p>';
            applySmartLinks();
        }

        function bindImport() {
            elements.importInput.addEventListener('change', (event) => {
                const file = event.target.files && event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const backup = JSON.parse(e.target.result);
                        if (backup.sidebar) {
                            localStorage.setItem(STORAGE_KEYS.sidebar, backup.sidebar);
                            elements.sidebar.innerHTML = backup.sidebar;
                        }
                        if (backup.events) {
                            eventsCache = typeof backup.events === 'string' ? JSON.parse(backup.events) : backup.events;
                            localStorage.setItem(STORAGE_KEYS.events, JSON.stringify(eventsCache));
                        }
                        if (backup.links || backup.tarajim) {
                            tarajimData = backup.links || backup.tarajim;
                            localStorage.setItem(STORAGE_KEYS.tarajim, JSON.stringify(tarajimData));
                        }
                        activateInitialItem();
                        alert('تم الاستيراد بنجاح.');
                    } catch (err) { alert('ملف النسخة الاحتياطية غير صالح.'); }
                };
                reader.readAsText(file, 'utf-8');
            });
        }

        // Tooltip Logic EXACTLY as in user.js
        function applySmartLinks() {
            if (!elements.content) return;
            attachSmartLinkListeners();
        }

        function attachSmartLinkListeners() {
            // We use delegation for efficiency but same behavior
            elements.content.addEventListener('mouseover', (e) => {
                const link = e.target.closest('.smart-link, a[data-link-id]');
                if (link && currentMode === 'read') showTooltip(link);
            });
            elements.content.addEventListener('mousemove', (e) => {
                const link = e.target.closest('.smart-link, a[data-link-id]');
                if (link && currentMode === 'read') positionTooltip(e);
            });
            elements.content.addEventListener('mouseout', (e) => {
                const link = e.target.closest('.smart-link, a[data-link-id]');
                if (link) hideTooltip();
            });

            // Touch support for iPad
            elements.content.addEventListener('touchstart', (e) => {
                const link = e.target.closest('.smart-link, a[data-link-id]');
                if (link && currentMode === 'read') {
                    showTooltip(link);
                    const r = link.getBoundingClientRect();
                    elements.tooltip.style.top = (r.bottom + window.scrollY + 10) + 'px';
                    elements.tooltip.style.left = (r.left + window.scrollX) + 'px';
                }
            });
        }

        function showTooltip(link) {
            const lid = link.dataset.linkId;
            const text = link.textContent.trim();
            let data = tarajimData[lid];

            // Fallback fuzzy search if ID missing
            if (!data) {
                for (let k in tarajimData) {
                    if (tarajimData[k].العنوان === text || tarajimData[k].كلمة_مفتاحية === text) {
                        data = tarajimData[k]; break;
                    }
                }
            }

            if (!data) return;

            let html = '';
            if (data.صورة) html += `<img src="${data.صورة}">`;
            if (data.العنوان) html += `<strong>${data.العنوان}</strong><br>`;
            if (data.المحتوى || data.المحوى) html += data.المحتوى || data.المحوى;

            elements.tooltipContent.innerHTML = html || 'لا توجد بيانات.';
            elements.tooltip.style.display = 'block';
        }

        function positionTooltip(event) {
            const offset = 12;
            elements.tooltip.style.top = `${event.pageY + offset}px`;
            elements.tooltip.style.left = `${event.pageX + offset}px`;
        }

        function hideTooltip() {
            elements.tooltip.style.display = 'none';
            elements.tooltipContent.innerHTML = '';
        }

        function setupModes() {
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.onclick = () => {
                    currentMode = btn.dataset.mode;
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('toolbar').style.display = (currentMode === 'edit' ? 'flex' : 'none');

                    if (currentMode === 'edit') {
                        elements.content.contentEditable = true;
                        elements.sidebar.contentEditable = true;
                    } else {
                        const activeLi = elements.sidebar.querySelector('li.active');
                        if (activeLi) eventsCache[activeLi.dataset.eventId] = elements.content.innerHTML;
                        localStorage.setItem(STORAGE_KEYS.events, JSON.stringify(eventsCache));
                        localStorage.setItem(STORAGE_KEYS.sidebar, elements.sidebar.innerHTML);

                        elements.content.contentEditable = false;
                        elements.sidebar.contentEditable = false;
                        applySmartLinks();
                    }
                };
            });
        }

        document.getElementById('export-btn').onclick = () => {
            const blob = new Blob([JSON.stringify({
                sidebar: elements.sidebar.innerHTML,
                events: eventsCache,
                links: tarajimData
            })], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `sira_backup.json`;
            a.click();
        };

        function exec(cmd) { document.execCommand(cmd, false, null); }

        window.onload = init;
    </script>

</body>

</html>
