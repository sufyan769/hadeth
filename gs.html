<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منصة بيان للحديث النبوي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: 'Noto Kufi Arabic', sans-serif;
        background-color: #ffffff;
      }
      .font-amiri {
        font-family: 'Amiri', serif;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.4s ease-out forwards;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      /* Ensure floating buttons are always on top */
      .floating-controls {
        z-index: 9999;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "algoliasearch/lite": "https://aistudiocdn.com/algoliasearch@^5.45.0/lite",
    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.0/client",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "firebase/app": "https://aistudiocdn.com/firebase@^12.6.0/app",
    "firebase/firestore": "https://aistudiocdn.com/firebase@^12.6.0/firestore",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/",
    "algoliasearch/": "https://aistudiocdn.com/algoliasearch@^5.45.0/"
  }
}
</script>
  </head>
  <body class="text-gray-900 min-h-screen relative">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import * as React from 'react';
      const { useState, useEffect } = React;
      import { createRoot } from 'react-dom/client';
      import { initializeApp } from 'firebase/app';
      import { getFirestore, doc, setDoc, getDoc, query, collection, where, documentId, getDocs, limit, orderBy } from 'firebase/firestore';
      import { liteClient } from 'algoliasearch/lite';

      // --- 1. FIREBASE CONFIGURATION ---
      const firebaseConfig = {
        apiKey: "AIzaSyBYJ2pVoWJ5ednWOnnF2dOJ43MJvDi_8rw",
        authDomain: "hadeth-7baf7.firebaseapp.com",
        projectId: "hadeth-7baf7",
        storageBucket: "hadeth-7baf7.firebasestorage.app",
        messagingSenderId: "401684715520",
        appId: "1:401684715520:web:297abdb6aee1fb3176a0e5",
        measurementId: "G-LGET278KWQ"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // --- 2. ALGOLIA CONFIGURATION ---
      const ALGOLIA_APP_ID = '88G4AVERCC';
      const ALGOLIA_API_KEY = '76402a5d814264e01fb86ca687d26e30';
      const ALGOLIA_INDEX_NAME = 'firebase-hadeth';

      const algoliaClient = liteClient(ALGOLIA_APP_ID, ALGOLIA_API_KEY);
      const searchCache = {};

      // --- 3. SERVICES & HELPERS ---

      const cleanText = (text) => {
        if (text === null || text === undefined) return "";
        const str = String(text);
        let cleaned = str.replace(/([\])])(?=[^\s])/g, '$1 ');
        cleaned = cleaned.replace(/([^\s])(?=[\[(])/g, '$1 ');
        return cleaned;
      };

      const searchHadith = async (queryText) => {
        const normalizedQuery = queryText.trim().toLowerCase();

        if (searchCache[normalizedQuery]) {
          return searchCache[normalizedQuery];
        }

        try {
          const response = await algoliaClient.search({
            requests: [
              {
                indexName: ALGOLIA_INDEX_NAME,
                query: normalizedQuery,
                hitsPerPage: 20,
                attributesToRetrieve: ['*'], 
                attributesToHighlight: ['text']
              }
            ]
          });

          const firstResult = response.results[0]; 
          const hits = (firstResult.hits || []).map((hit) => ({
            ...hit,
            objectID: hit.objectID
          }));
          
          const result = { hits };
          searchCache[normalizedQuery] = result;
          return result;
        } catch (error) {
          console.error("Algolia Search Error:", error);
          throw error;
        }
      };

      const getHadithsByIds = async (ids) => {
          if (!ids || ids.length === 0) return [];
          try {
              const q = query(collection(db, "hadiths"), where(documentId(), "in", ids));
              const querySnapshot = await getDocs(q);
              const hadiths = [];
              querySnapshot.forEach((docSnap) => {
                  hadiths.push({ 
                      id: docSnap.id, 
                      objectID: docSnap.id, 
                      ...docSnap.data() 
                  });
              });
              return hadiths;
          } catch (error) {
              console.error("Firestore Batch Error:", error);
              return [];
          }
      };

      const getHadithsByCategory = async (category) => {
        try {
          const q = query(
            collection(db, "hadiths"), 
            where("categories", "array-contains", category),
            limit(20)
          );
          const querySnapshot = await getDocs(q);
          const hadiths = [];
          querySnapshot.forEach((docSnap) => {
             hadiths.push({
               id: docSnap.id,
               objectID: docSnap.id,
               ...docSnap.data()
             });
          });
          return hadiths;
        } catch (error) {
          console.error("Firestore Category Search Error:", error);
          return [];
        }
      };

      const getHadithDetails = async (id) => {
          try {
              const docRef = doc(db, "hadiths", id);
              const docSnap = await getDoc(docRef);
              if (docSnap.exists()) {
                  return { id: docSnap.id, objectID: docSnap.id, ...docSnap.data() };
              }
              return null;
          } catch (error) {
              console.error("Firestore Single Error:", error);
              return null;
          }
      }

      const updateHadithSharh = async (id, newSharh) => {
        try {
          const hadithRef = doc(db, "hadiths", id); 
          await setDoc(hadithRef, { sharh: newSharh }, { merge: true });
        } catch (error) {
          console.error("Firestore Update Error: ", error);
          throw error;
        }
      };

      // --- 4. COMPONENTS ---

      const FloatingControls = ({ onBack, onSizeUp, onSizeDown }) => {
        return (
             <div className="fixed bottom-6 right-2 floating-controls flex flex-col items-center gap-3">
                {/* Font Size */}
                <div className="flex flex-col gap-1 bg-gray-900/90 p-1.5 rounded-full backdrop-blur-md shadow-xl border border-gray-700/50">
                <button 
                    onClick={onSizeUp} 
                    className="w-10 h-10 flex items-center justify-center text-white rounded-full hover:bg-white/20 transition active:scale-95"
                >
                    <span className="text-xl font-bold select-none">+</span>
                </button>
                <div className="h-px w-6 bg-gray-600 mx-auto my-1"></div>
                <button 
                    onClick={onSizeDown} 
                    className="w-10 h-10 flex items-center justify-center text-white rounded-full hover:bg-white/20 transition active:scale-95"
                >
                    <span className="text-xl font-bold select-none">-</span>
                </button>
                </div>

                {/* Back Button */}
                <button 
                onClick={onBack}
                className="w-14 h-14 bg-emerald-600 text-white rounded-full shadow-2xl flex items-center justify-center hover:bg-emerald-700 transition-all active:scale-95 hover:shadow-emerald-500/50 border-2 border-white/10"
                title="عودة"
                >
                <svg className="w-6 h-6 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 19l-7-7 7-7"></path></svg>
                </button>
            </div>
        )
      };

      const FormattedText = ({ text, className = "", style = {} }) => {
        if (!text) return null;
        
        const cleanedText = cleanText(text);

        // Split text on dot only as requested
        const segments = cleanedText.split(/(?<=[.])\s+/);

        return (
          <div className={`space-y-3 ${className}`} style={style}>
            {segments.map((segment, index) => {
              if (!segment.trim()) return null;
              return (
                <p key={index} className="leading-loose">
                  {segment.trim()}
                </p>
              );
            })}
          </div>
        );
      };

      const HighlightText = ({ text, className = "", style = {} }) => {
        const cleaned = cleanText(text);
        return (
          <p className={`font-amiri leading-loose text-gray-800 ${className}`} style={style}>
            {cleaned}
          </p>
        );
      };

      const HadithList = ({ hadiths, onSelect }) => {
        if (hadiths.length === 0) {
          return (
            <div className="text-center py-12">
              <p className="text-gray-500 text-lg">لا توجد نتائج.</p>
            </div>
          );
        }

        return (
          <div className="w-full px-1">
            {hadiths.map((hadith) => (
              <div 
                key={hadith.objectID} 
                onClick={() => onSelect(hadith)}
                className="py-6 border-b border-gray-100 cursor-pointer hover:bg-gray-50 transition-colors animate-fade-in last:border-0"
              >
                <div className="mb-2 flex items-center gap-2 flex-wrap text-xs">
                  <span className="font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">
                    {hadith.source || 'مصدر غير محدد'}
                  </span>
                  {hadith.page_or_number && (
                     <span className="text-gray-500 bg-gray-50 px-2 py-0.5 rounded border border-gray-100">
                       {hadith.page_or_number}
                     </span>
                  )}
                  {hadith.hukm && (
                    <>
                      <span className="text-gray-300">|</span>
                      <span className={`font-medium ${
                        hadith.hukm.includes('صحيح') ? 'text-green-700' : 
                        hadith.hukm.includes('ضعيف') ? 'text-red-700' : 'text-gray-600'
                      }`}>
                        {cleanText(hadith.hukm)}
                      </span>
                    </>
                  )}
                </div>
                
                <HighlightText text={hadith.text} className="text-xl text-gray-900 line-clamp-3" />
                
                <div className="mt-2 text-sm text-gray-400 flex items-center gap-2 overflow-hidden whitespace-nowrap text-ellipsis">
                  {hadith.rawi && <span>الراوي: {cleanText(Array.isArray(hadith.rawi) ? hadith.rawi.join(', ') : hadith.rawi)}</span>}
                </div>
              </div>
            ))}
          </div>
        );
      };

      const HadithDetail = ({ hadith: initialHadith, onBack, onUpdate, onSmartLinkClick }) => {
        const [hadith, setHadith] = useState(initialHadith);
        const [isLoadingDetails, setIsLoadingDetails] = useState(false);
        const [isEditing, setIsEditing] = useState(false);
        const [sharh, setSharh] = useState(initialHadith.sharh || '');
        const [isSaving, setIsSaving] = useState(false);
        const [error, setError] = useState(null);
        
        const [fontSize, setFontSize] = useState(22); 

        useEffect(() => {
          let isMounted = true;
          const fetchFullDetails = async () => {
              setIsLoadingDetails(true);
              try {
                  const targetId = initialHadith.id || initialHadith.objectID;
                  const freshData = await getHadithDetails(targetId);
                  
                  if (isMounted && freshData) {
                      const mergedHadith = { ...initialHadith, ...freshData };
                      setHadith(mergedHadith);
                      setSharh(mergedHadith.sharh || '');
                      onUpdate(mergedHadith);
                  }
              } catch (err) {
                  console.error("Failed to fetch full details", err);
              } finally {
                  if (isMounted) setIsLoadingDetails(false);
              }
          };
          fetchFullDetails();
          return () => { isMounted = false; };
        }, [initialHadith.objectID]);

        const handleSave = async () => {
          const targetId = hadith.id || hadith.objectID;
          if (!targetId) {
              setError("لا يوجد معرف للحديث للحفظ");
              return;
          }
          setIsSaving(true);
          setError(null);
          try {
            await updateHadithSharh(targetId, sharh);
            const updated = { ...hadith, sharh };
            setHadith(updated);
            onUpdate(updated);
            setIsEditing(false);
          } catch (err) {
            console.error("Save Error:", err);
            if (err.code === 'permission-denied') {
              setError("لا تملك صلاحية التعديل.");
            } else {
              setError("فشل الحفظ.");
            }
          } finally {
            setIsSaving(false);
          }
        };

        const adjustFontSize = (delta) => {
            setFontSize(prev => Math.min(Math.max(prev + delta, 16), 44));
        };

        return (
          <>
            {/* Main Content Wrapper - Animated */}
            <div className="bg-white min-h-screen pb-40 animate-fade-in relative w-full">
              
              {isLoadingDetails && (
                  <div className="fixed top-0 left-0 w-full h-1 z-50">
                      <div className="h-full bg-emerald-500 w-1/2 animate-pulse mx-auto"></div>
                  </div>
              )}

              <div className="w-full px-2 py-6">
                
                {/* Header Info */}
                <div className="mb-6 text-center">
                    <div className="inline-flex flex-wrap gap-2 text-sm text-gray-500 mb-6 justify-center w-full items-center">
                        {hadith.hukm && (
                          <span className={`px-2 py-1 bg-gray-50 rounded border border-gray-100 ${
                            hadith.hukm.includes('صحيح') ? 'text-green-700' : 
                            hadith.hukm.includes('ضعيف') ? 'text-red-700' : 'text-gray-600'
                          }`}>
                            {cleanText(hadith.hukm)}
                          </span>
                        )}
                        {hadith.source && <span className="px-2 py-1 bg-gray-50 rounded border border-gray-100">{hadith.source}</span>}
                        {hadith.page_or_number && <span className="px-2 py-1 bg-gray-50 rounded border border-gray-100">رقم: {hadith.page_or_number}</span>}
                    </div>
                    
                    {/* Hadith Text with Line Break Formatting */}
                    <div className="text-right px-1">
                        <FormattedText 
                          text={hadith.text} 
                          className="font-amiri text-gray-900 mb-6 transition-all duration-300 font-bold"
                          style={{ fontSize: `${fontSize}px` }} 
                        />
                    </div>
                </div>

                {/* Data Grid */}
                <div className="border-t border-gray-100 pt-6 mb-8">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-y-6 gap-x-4 text-sm text-gray-700 px-1">
                        
                        {/* Rawi */}
                        <div className="border-b border-gray-50 pb-2 md:border-0">
                            <span className="font-bold block mb-2 text-emerald-700 text-sm">الراوي</span>
                            {hadith.rawi ? (
                               <button 
                                 onClick={() => {
                                   onSmartLinkClick(Array.isArray(hadith.rawi) ? hadith.rawi[0] : hadith.rawi, 'text')
                                 }}
                                 className="text-amber-900 text-lg hover:text-amber-700 underline decoration-dotted underline-offset-4 transition-colors text-right font-amiri"
                               >
                                 {cleanText(Array.isArray(hadith.rawi) ? hadith.rawi.join('، ') : hadith.rawi)}
                               </button>
                            ) : '-'}
                        </div>

                        {/* Muhaddith */}
                        <div className="border-b border-gray-50 pb-2 md:border-0">
                            <span className="font-bold block mb-2 text-emerald-700 text-sm">المحدث</span>
                            <span className="text-amber-900 text-lg font-amiri">{cleanText(hadith.muhaddith) || '-'}</span>
                        </div>

                        {/* Takhrij */}
                        {hadith.takhrij && (
                           <div className="md:col-span-2 border-b border-gray-50 pb-2 md:border-0">
                              <span className="font-bold block mb-2 text-emerald-700 text-sm">التخريج</span>
                              <p className="leading-relaxed text-amber-900 text-lg font-amiri">{cleanText(hadith.takhrij)}</p>
                          </div>
                        )}

                        {/* Categories (Smart Links) - FIREBASE SEARCH */}
                        {hadith.categories && hadith.categories.length > 0 && (
                          <div className="md:col-span-2 pt-2">
                             <span className="font-bold block mb-3 text-emerald-700 text-sm">التصنيفات</span>
                             <div className="flex flex-wrap gap-2">
                               {hadith.categories.map((cat, idx) => (
                                 <button 
                                   key={idx}
                                   onClick={() => onSmartLinkClick(cat, 'category')}
                                   className="px-3 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs rounded-full transition-colors duration-200 border border-emerald-100"
                                 >
                                   #{cat}
                                 </button>
                               ))}
                             </div>
                          </div>
                        )}
                    </div>
                </div>

                {/* Sharh Section */}
                <div className="mt-8 px-1">
                    <div className="flex justify-between items-center mb-4 border-b-2 border-emerald-100 pb-2">
                        <h2 className="text-lg font-bold text-gray-800 font-amiri">الشرح</h2>
                        {!isEditing && (
                            <button onClick={() => setIsEditing(true)} className="text-emerald-600 text-sm font-bold hover:text-emerald-800">تعديل</button>
                        )}
                    </div>

                    {isEditing ? (
                        <div className="space-y-4 animate-fade-in">
                            <textarea 
                                value={sharh}
                                onChange={(e) => setSharh(e.target.value)}
                                className="w-full p-4 border border-gray-300 rounded-lg focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none min-h-[300px] font-amiri text-lg leading-loose"
                                placeholder="أدخل الشرح..."
                            />
                            <div className="flex gap-3 justify-end">
                                <button onClick={() => setIsEditing(false)} className="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg" disabled={isSaving}>إلغاء</button>
                                <button onClick={handleSave} disabled={isSaving} className="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg transition-colors shadow-sm">
                                    {isSaving ? '...' : 'حفظ'}
                                </button>
                            </div>
                            {error && <p className="text-red-500 text-xs">{error}</p>}
                        </div>
                    ) : (
                        <FormattedText 
                          text={sharh} 
                          className="text-gray-700 font-amiri transition-all duration-300"
                          style={{ fontSize: `${fontSize - 2}px` }}
                        />
                    )}
                    
                    {!sharh && !isEditing && (
                      <p className="text-gray-400 text-sm py-4">لا يوجد شرح متوفر حالياً.</p>
                    )}
                </div>

                {/* Osoul (Origins) Section - Bottom */}
                {hadith.osoul && (
                  <div className="mt-12 px-1 border-t border-gray-100 pt-8">
                       <h2 className="text-lg font-bold text-gray-800 font-amiri mb-4">أصل الحديث</h2>
                       <FormattedText 
                          text={hadith.osoul} 
                          className="text-gray-600 font-amiri leading-loose"
                          style={{ fontSize: `${fontSize - 4}px` }}
                        />
                  </div>
                )}
              </div>
            </div>

            {/* Floating Buttons: Rendered OUTSIDE the animated div to remain strictly fixed */}
            <FloatingControls 
                onBack={onBack}
                onSizeUp={() => adjustFontSize(2)}
                onSizeDown={() => adjustFontSize(-2)}
            />
          </>
        );
      };

      // --- 5. MAIN APP ---

      const App = () => {
        const [queryInput, setQueryInput] = useState('');
        const [results, setResults] = useState([]);
        const [loading, setLoading] = useState(false);
        const [hasSearched, setHasSearched] = useState(false);
        const [selectedHadith, setSelectedHadith] = useState(null);
        const [error, setError] = useState(null);
        
        const executeSearch = async (term, type = 'text') => {
          if (!term.trim()) return;

          setLoading(true);
          setError(null);
          setHasSearched(true);
          setSelectedHadith(null);
          setQueryInput(term);

          try {
            let hits = [];
            
            // Branch logic: Category vs Text
            if (type === 'category') {
              // Direct Firestore Query
              const firestoreHits = await getHadithsByCategory(term);
              hits = firestoreHits;
            } else {
              // Algolia Search (Standard)
              const algoliaResponse = await searchHadith(term);
              const algoliaHits = algoliaResponse.hits;
              
              if (algoliaHits.length > 0) {
                  const ids = algoliaHits.map(hit => hit.objectID);
                  const firestoreData = await getHadithsByIds(ids);

                  // Merge sorting by Algolia relevance
                  hits = algoliaHits.map(algoliaHit => {
                      const fullData = firestoreData.find(f => f.id === algoliaHit.objectID);
                      return fullData || algoliaHit;
                  }).filter(Boolean);
              }
            }

            setResults(hits);

          } catch (err) {
            setError('خطأ في الاتصال.');
            console.error(err);
          } finally {
            setLoading(false);
          }
        };

        const handleSearchSubmit = (e) => {
          e.preventDefault();
          executeSearch(queryInput, 'text');
        };

        const handleHadithUpdate = (updatedHadith) => {
          setSelectedHadith(updatedHadith);
          setResults(prev => prev.map(h => 
            (h.objectID === updatedHadith.objectID || h.id === updatedHadith.id) ? updatedHadith : h
          ));
        };
        
        return (
          <div className="min-h-screen bg-white font-sans flex flex-col">
            {/* Minimal Navbar */}
            {!selectedHadith && (
              <nav className="bg-white border-b border-gray-100 py-4 sticky top-0 z-20">
                <div className="max-w-4xl mx-auto px-4 flex justify-between items-center">
                   <h1 
                     className="text-lg font-bold font-amiri text-emerald-800 cursor-pointer" 
                     onClick={() => { setHasSearched(false); setQueryInput(''); setResults([]); }}
                   >
                     بيان
                   </h1>
                </div>
              </nav>
            )}

            <main className="flex-1 w-full max-w-4xl mx-auto px-1 md:px-2 py-4">
              {selectedHadith ? (
                <HadithDetail 
                  hadith={selectedHadith} 
                  onBack={() => setSelectedHadith(null)}
                  onUpdate={handleHadithUpdate}
                  onSmartLinkClick={(term, type) => executeSearch(term, type)}
                />
              ) : (
                <div className="flex flex-col items-center">
                  <div className={`w-full transition-all duration-500 ${hasSearched ? 'mb-6' : 'mt-12 md:mt-24'}`}>
                    {!hasSearched && (
                       <div className="text-center mb-10 px-4">
                           <h2 className="text-2xl md:text-4xl font-bold text-gray-900 mb-3 font-amiri">ابحث في السنة النبوية</h2>
                           <p className="text-gray-500">بحث فوري دقيق وموثق</p>
                       </div>
                    )}
                    
                    <form onSubmit={handleSearchSubmit} className="relative w-full max-w-2xl mx-auto px-2">
                      <div className="relative">
                          {/* Search Button moved to LEFT */}
                          <button
                            type="submit"
                            disabled={loading || !queryInput.trim()}
                            className="absolute left-1.5 top-1.5 bottom-1.5 w-10 h-10 bg-emerald-600 hover:bg-emerald-700 text-white rounded-full flex items-center justify-center transition-colors disabled:bg-gray-200 z-10"
                          >
                          {loading ? (
                              <span className="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
                          ) : (
                              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                          )}
                          </button>

                          <input
                            type="text"
                            value={queryInput}
                            onChange={(e) => setQueryInput(e.target.value)}
                            placeholder="ابحث..."
                            className="w-full pl-14 pr-4 py-3 text-lg bg-white border-2 border-gray-900 rounded-full focus:ring-2 focus:ring-emerald-500/20 outline-none transition-all placeholder-gray-400 shadow-sm"
                          />
                      </div>
                    </form>
                  </div>

                  {error ? (
                    <div className="text-red-500 text-center mt-4">
                      {error}
                    </div>
                  ) : hasSearched && !loading ? (
                     <div className="w-full animate-fade-in">
                         <HadithList hadiths={results} onSelect={setSelectedHadith} />
                     </div>
                  ) : null}
                </div>
              )}
            </main>
          </div>
        );
      };

      const root = createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
