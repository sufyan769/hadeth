<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة بيان - بحث الأحاديث</title>
    
    <!-- CSS Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/instantsearch.css@8.1.0/themes/satellite-min.css">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">

    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- Algolia InstantSearch -->
    <script src="https://cdn.jsdelivr.net/npm/algoliasearch@4.22.1/dist/algoliasearch-lite.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/instantsearch.js@4.64.1/dist/instantsearch.production.min.js"></script>

    <style>
        body { font-family: 'Noto Kufi Arabic', sans-serif; background-color: #ffffff; color: #1f2937; }
        .font-amiri { font-family: 'Amiri', serif; }
        
        /* InstantSearch Overrides for Minimal Design */
        .ais-SearchBox-input {
            border-radius: 9999px;
            padding: 12px 20px 12px 60px; /* Adjusted padding for left button */
            border: 2px solid #1f2937; /* Black border as requested */
            box-shadow: none;
            font-family: 'Amiri', serif;
            font-size: 1.1rem;
            width: 100%;
        }
        /* Hide default submit/reset since we use custom ones */
        .ais-SearchBox-submit, .ais-SearchBox-reset { display: none; }
        
        .ais-Pagination-item--selected .ais-Pagination-link {
            background-color: #059669;
            border-color: #059669;
            color: white;
        }
        .ais-Pagination-link { border-radius: 8px; }

        /* Floating Controls */
        .floating-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 40;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 50;
            display: none; /* Hidden by default */
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 1rem;
            width: 100%;
            max-width: 42rem; /* max-w-2xl */
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .editor-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-family: 'Amiri', serif;
            font-size: 1rem;
            margin-top: 4px;
        }
        .editor-input:focus {
            outline: none;
            border-color: #059669;
            ring: 2px solid #059669;
        }
        .editor-label {
            font-weight: bold;
            font-size: 0.9rem;
            color: #047857;
            margin-bottom: 2px;
            display: block;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/",
    "algoliasearch/": "https://aistudiocdn.com/algoliasearch@^5.45.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"

}
</script>
</head>
<body>

    <!-- Navbar -->
    <nav class="border-b border-gray-100 py-4 sticky top-0 bg-white/95 backdrop-blur z-40">
        <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
            <h1 class="text-xl font-bold font-amiri text-emerald-800 cursor-pointer select-none" onclick="goHome()">بيان</h1>
            <a href="gnv.html" class="text-xs text-gray-400 hover:text-emerald-600 font-medium">لوحة الإدارة</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-2 py-6 min-h-screen pb-32">
        
        <!-- View 1: Search -->
        <div id="search-view">
            <div class="mb-8 relative max-w-2xl mx-auto">
                <div id="searchbox"></div>
            </div>
            
            <div id="stats" class="text-center text-sm text-gray-400 mb-4 font-amiri"></div>
            
            <div id="hits"></div>
            <div id="pagination" class="mt-8 flex justify-center dir-ltr"></div>
        </div>

        <!-- View 2: Details -->
        <div id="detail-view" style="display: none;" class="animate-fade-in">
            <!-- Content Injected via JS -->
            <div id="detail-content"></div>
        </div>

    </main>

    <!-- Floating Controls -->
    <div class="floating-controls">
        <!-- Font Size Controls -->
        <div class="flex flex-col gap-1 bg-gray-900/90 p-1.5 rounded-full backdrop-blur-md shadow-xl border border-gray-700/50">
            <button onclick="changeFontSize(2)" class="w-10 h-10 flex items-center justify-center text-white rounded-full hover:bg-white/20 transition active:scale-95 text-xl font-bold">+</button>
            <div class="h-px w-6 bg-gray-600 mx-auto my-1"></div>
            <button onclick="changeFontSize(-2)" class="w-10 h-10 flex items-center justify-center text-white rounded-full hover:bg-white/20 transition active:scale-95 text-xl font-bold">-</button>
        </div>
        
        <!-- Back Button (Only visible in Detail view) -->
        <button id="fab-back" onclick="goBack()" class="w-14 h-14 bg-emerald-600 text-white rounded-full shadow-2xl flex items-center justify-center hover:bg-emerald-700 transition active:scale-95 border-2 border-white/10 hidden">
            <svg class="w-6 h-6 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 19l-7-7 7-7"></path></svg>
        </button>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content animate-fade-in-up">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center sticky top-0 bg-white z-10 rounded-t-2xl">
                <h2 class="text-xl font-bold text-gray-800 font-amiri">تعديل الحديث</h2>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-red-500">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-6 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="editor-label">رقم الحديث (ID)</label>
                        <input type="text" id="modal-id" class="editor-input bg-gray-100 cursor-not-allowed" disabled>
                    </div>
                    <div>
                        <label class="editor-label">الصفحة / الرقم</label>
                        <input type="text" id="modal-page" class="editor-input">
                    </div>
                </div>

                <div>
                    <label class="editor-label">نص الحديث</label>
                    <textarea id="modal-text" rows="5" class="editor-input"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="editor-label">الراوي (افصل بفاصلة)</label>
                        <input type="text" id="modal-rawi" class="editor-input">
                    </div>
                     <div>
                        <label class="editor-label">المحدث</label>
                        <input type="text" id="modal-muhaddith" class="editor-input">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="editor-label">الحكم</label>
                        <input type="text" id="modal-hukm" class="editor-input">
                    </div>
                    <div>
                        <label class="editor-label">المصدر</label>
                        <input type="text" id="modal-source" class="editor-input">
                    </div>
                </div>

                <div>
                    <label class="editor-label">التصنيفات (افصل بفاصلة)</label>
                    <input type="text" id="modal-categories" class="editor-input">
                </div>

                <div>
                    <label class="editor-label">التخريج</label>
                    <textarea id="modal-takhrij" rows="2" class="editor-input"></textarea>
                </div>

                <div>
                    <label class="editor-label">الشرح</label>
                    <textarea id="modal-sharh" rows="4" class="editor-input"></textarea>
                </div>

                 <div>
                    <label class="editor-label">أصل الحديث</label>
                    <textarea id="modal-osoul" rows="3" class="editor-input"></textarea>
                </div>
            </div>

            <div class="p-6 border-t border-gray-100 bg-gray-50 flex justify-end gap-3 rounded-b-2xl sticky bottom-0">
                <button onclick="closeEditModal()" class="px-5 py-2 rounded-lg text-gray-600 hover:bg-gray-200 font-medium">إلغاء</button>
                <button onclick="saveFullEdit()" id="modal-save-btn" class="px-6 py-2 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700 font-bold shadow-lg flex items-center gap-2">
                    حفظ التغييرات
                </button>
            </div>
        </div>
    </div>

    <script>
        // ------------------------------------------
        // 1. CONFIGURATION
        // ------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyBYJ2pVoWJ5ednWOnnF2dOJ43MJvDi_8rw",
            authDomain: "hadeth-7baf7.firebaseapp.com",
            projectId: "hadeth-7baf7",
            storageBucket: "hadeth-7baf7.firebasestorage.app",
            messagingSenderId: "401684715520",
            appId: "1:401684715520:web:297abdb6aee1fb3176a0e5",
            measurementId: "G-LGET278KWQ"
        };

        const ALGOLIA_APP_ID = '88G4AVERCC';
        const ALGOLIA_API_KEY = '76402a5d814264e01fb86ca687d26e30';
        const ALGOLIA_INDEX_NAME = 'firebase-hadeth';

        // GLOBAL VARIABLES
        let currentFontSize = 22;
        let db; 
        let currentHadithData = null; // Store current hadith for editing

        // ------------------------------------------
        // 2. INITIALIZATION
        // ------------------------------------------
        try {
            if (!firebase || !algoliasearch) {
                console.warn("SDKs might not be loaded yet.");
            } else {
                console.log("SDKs loaded successfully.");
            }
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            const searchClient = algoliasearch(ALGOLIA_APP_ID, ALGOLIA_API_KEY);

            // ------------------------------------------
            // 3. INSTANT SEARCH SETUP
            // ------------------------------------------
            const search = instantsearch({
                indexName: ALGOLIA_INDEX_NAME,
                searchClient,
                rtl: true,
                searchFunction(helper) {
                    if (helper.state.query) {
                        helper.search();
                    } else {
                        const hits = document.querySelector('#hits');
                        const stats = document.querySelector('#stats');
                        const pagination = document.querySelector('#pagination');
                        if (hits) hits.innerHTML = '';
                        if (stats) stats.innerHTML = '';
                        if (pagination) pagination.innerHTML = '';
                    }
                }
            });

            const customSearchBox = instantsearch.connectors.connectSearchBox(
                (renderOptions, isFirstRender) => {
                    const { query, refine, widgetParams } = renderOptions;

                    if (isFirstRender) {
                        const container = document.querySelector(widgetParams.container);
                        container.innerHTML = `
                            <div class="relative w-full">
                                <input 
                                    type="search" 
                                    id="custom-search-input"
                                    class="ais-SearchBox-input focus:ring-2 focus:ring-emerald-500/20 outline-none w-full shadow-sm"
                                    placeholder="${widgetParams.placeholder}"
                                    style="padding-left: 3.5rem; padding-right: 1.5rem;" 
                                >
                                <button id="custom-search-btn" class="absolute left-2 top-1/2 -translate-y-1/2 bg-emerald-600 hover:bg-emerald-700 text-white p-2 rounded-full transition shadow-md flex items-center justify-center cursor-pointer">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                    </svg>
                                </button>
                            </div>
                        `;

                        const input = container.querySelector('#custom-search-input');
                        const btn = container.querySelector('#custom-search-btn');

                        input.addEventListener('keypress', (event) => {
                            if (event.key === 'Enter') {
                                refine(input.value);
                            }
                        });

                        btn.addEventListener('click', () => {
                            refine(input.value);
                        });
                    }
                    const input = document.querySelector('#custom-search-input');
                    if (input && document.activeElement !== input) {
                        input.value = query;
                    }
                }
            );

            const customHits = instantsearch.connectors.connectHits(
                (renderOptions, isFirstRender) => {
                    const { hits, widgetParams } = renderOptions;
                    const container = document.querySelector(widgetParams.container);

                    if (!hits.length) {
                        if (document.querySelector('#custom-search-input')?.value) {
                             container.innerHTML = '<div class="text-center py-10 text-gray-500">لا توجد نتائج مطابقة لبحثك.</div>';
                        }
                        return;
                    }

                    container.innerHTML = hits.map(hit => {
                        const targetId = hit.id || hit.objectID;
                        
                        const rawiText = Array.isArray(hit.rawi) ? hit.rawi.join('، ') : (hit.rawi || '');
                        const sourceText = hit.source || 'جاري التحميل...';
                        const hukmText = hit.hukm || '';
                        
                        let hukmClass = 'text-gray-600 bg-gray-50';
                        if (hukmText.includes('صحيح')) hukmClass = 'text-green-700 bg-green-50';
                        else if (hukmText.includes('ضعيف')) hukmClass = 'text-red-700 bg-red-50';

                        const domId = `hit-${hit.objectID}`;

                        return `
                        <div class="py-6 border-b border-gray-100 cursor-pointer hover:bg-gray-50 transition-colors" onclick="openDetail('${targetId}')">
                            <div class="mb-2 flex items-center gap-2 flex-wrap text-xs">
                                <span id="${domId}-source" class="font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">${sourceText}</span>
                                <span id="${domId}-hukm" class="${hukmClass} px-2 py-0.5 rounded border border-gray-100 font-bold ${!hukmText ? 'hidden' : ''}">${hukmText}</span>
                            </div>
                            <p class="font-amiri text-xl text-gray-900 leading-loose line-clamp-3 content-scalable">
                                ${hit._highlightResult ? hit._highlightResult.text.value : hit.text}
                            </p>
                            <div class="mt-2 text-sm text-gray-500 flex gap-2">
                                <span id="${domId}-rawi" class="text-amber-900 ${!rawiText ? 'hidden' : ''}">الراوي: ${rawiText}</span>
                            </div>
                        </div>
                        `;
                    }).join('');

                    const idsToFetch = hits.map(h => {
                        let cleanId = h.objectID;
                        if (h.id) cleanId = h.id;
                        else if (String(h.objectID).includes('-')) cleanId = String(h.objectID).split('-')[0];
                        return { objectID: h.objectID, dbKey: String(cleanId) };
                    });

                    hydrateHits(idsToFetch);
                }
            );

            search.addWidgets([
                instantsearch.widgets.configure({
                    attributesToRetrieve: ['*'], 
                }),
                customSearchBox({
                    container: '#searchbox',
                    placeholder: 'اكتب كلمة للبحث (مثلاً: إنما الأعمال بالنيات)...',
                }),
                customHits({
                    container: '#hits',
                }),
                instantsearch.widgets.pagination({
                    container: '#pagination',
                    scrollTo: '#searchbox',
                    padding: 2,
                    showFirst: false,
                    showLast: false,
                }),
                instantsearch.widgets.stats({
                    container: '#stats',
                    templates: {
                        text: '{{#hasNoResults}}لم يتم العثور على نتائج{{/hasNoResults}}{{#hasOneResult}}نتيجة واحدة{{/hasOneResult}}{{#hasManyResults}}تم العثور على {{nbHits}} حديث{{/hasManyResults}}',
                    },
                }),
            ]);

            search.start();
        } catch(e) {
            console.error("Initialization Error:", e);
        }

        // ------------------------------------------
        // 4. URL & DEEP LINKING LOGIC
        // ------------------------------------------
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const initialId = urlParams.get('id');
            if (initialId) {
                openDetail(initialId, false);
            }
        });

        window.addEventListener('popstate', (event) => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) {
                openDetail(id, false);
            } else {
                showView('search-view');
            }
        });

        function copyLink(id) {
            const url = `${window.location.origin}${window.location.pathname}?id=${id}`;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => {
                    const btn = document.getElementById('share-btn');
                    if(btn) {
                        const original = btn.innerHTML;
                        btn.innerHTML = `<span class="text-green-600 font-bold">تم النسخ!</span>`;
                        setTimeout(() => btn.innerHTML = original, 2000);
                    }
                });
            } else {
                prompt("انسخ الرابط التالي:", url);
            }
        }

        // ------------------------------------------
        // 5. HYDRATION LOGIC
        // ------------------------------------------
        async function hydrateHits(items) {
            const keys = items.map(i => i.dbKey);
            if (keys.length === 0) return;

            try {
                const q = db.collection('hadiths').where(firebase.firestore.FieldPath.documentId(), 'in', keys);
                const snapshot = await q.get();
                
                const foundDocs = {};
                snapshot.forEach(doc => {
                    foundDocs[doc.id] = doc.data();
                });

                items.forEach(item => {
                    const data = foundDocs[item.dbKey];
                    if (data) {
                        updateHitDOM(item.objectID, data);
                    }
                });
            } catch (e) {
                console.warn("Hydration error:", e);
            }
        }

        function updateHitDOM(objectID, data) {
            const domId = `hit-${objectID}`;
            
            const sourceEl = document.getElementById(`${domId}-source`);
            if (sourceEl && data.source) {
                sourceEl.textContent = Array.isArray(data.source) ? data.source[0] : data.source;
            }

            const hukmEl = document.getElementById(`${domId}-hukm`);
            if (hukmEl && data.hukm) {
                const val = Array.isArray(data.hukm) ? data.hukm[0] : data.hukm;
                hukmEl.textContent = val;
                hukmEl.classList.remove('hidden');
                
                hukmEl.className = `px-2 py-0.5 rounded border border-gray-100 font-bold ${
                    val.includes('صحيح') ? 'text-green-700 bg-green-50' : 
                    val.includes('ضعيف') ? 'text-red-700 bg-red-50' : 'text-gray-600 bg-gray-50'
                }`;
            }

            const rawiEl = document.getElementById(`${domId}-rawi`);
            if (rawiEl && data.rawi) {
                const val = Array.isArray(data.rawi) ? data.rawi.join('، ') : data.rawi;
                rawiEl.textContent = `الراوي: ${val}`;
                rawiEl.classList.remove('hidden');
            }
        }

        // ------------------------------------------
        // 6. VIEW LOGIC
        // ------------------------------------------
        function showView(viewId) {
            document.getElementById('search-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('fab-back').style.display = 'none';

            document.getElementById(viewId).style.display = 'block';
            window.scrollTo(0, 0);

            if (viewId !== 'search-view') {
                document.getElementById('fab-back').style.display = 'flex';
            }
        }

        function goBack() {
            showView('search-view');
            const cleanUrl = window.location.pathname;
            window.history.pushState({}, '', cleanUrl);
        }
        
        function goHome() {
            const input = document.querySelector('#custom-search-input');
            if(input) input.value = '';
            window.location.href = window.location.pathname;
        }

        // ------------------------------------------
        // 7. DETAIL LOGIC
        // ------------------------------------------
        async function openDetail(id, updateHistory = true) {
            showView('detail-view');
            const container = document.getElementById('detail-content');
            container.innerHTML = '<div class="text-center py-20 text-emerald-600">جاري تحميل الحديث...</div>';
            
            if (updateHistory) {
                const newUrl = `${window.location.pathname}?id=${id}`;
                window.history.pushState({ id: id }, '', newUrl);
            }

            try {
                let data = null;
                const docRef = db.collection('hadiths').doc(String(id));
                const docSnap = await docRef.get();

                if (docSnap.exists) {
                    data = { objectID: docSnap.id, ...docSnap.data() };
                } else {
                    const qString = db.collection('hadiths').where('id', '==', String(id)).limit(1);
                    const snapString = await qString.get();
                    
                    if (!snapString.empty) {
                        const d = snapString.docs[0];
                        data = { objectID: d.id, ...d.data() };
                    } else if (!isNaN(Number(id))) {
                        const qNum = db.collection('hadiths').where('id', '==', Number(id)).limit(1);
                        const snapNum = await qNum.get();
                         if (!snapNum.empty) {
                            const d = snapNum.docs[0];
                            data = { objectID: d.id, ...d.data() };
                        }
                    }

                    if (!data && String(id).includes('-')) {
                        const cleanId = String(id).split('-')[0];
                        const docClean = await db.collection('hadiths').doc(cleanId).get();
                        if (docClean.exists) {
                             data = { objectID: docClean.id, ...docClean.data() };
                        } else {
                            const qClean = await db.collection('hadiths').where('id', '==', cleanId).limit(1).get();
                            if (!qClean.empty) {
                                data = { objectID: qClean.docs[0].id, ...qClean.docs[0].data() };
                            } else if (!isNaN(Number(cleanId))) {
                                const qCleanNum = await db.collection('hadiths').where('id', '==', Number(cleanId)).limit(1).get();
                                if (!qCleanNum.empty) {
                                    data = { objectID: qCleanNum.docs[0].id, ...qCleanNum.docs[0].data() };
                                }
                            }
                        }
                    }
                }

                if (data) {
                    // STORE CURRENT DATA GLOBALLY
                    currentHadithData = data;
                    renderHadithDetail(data);
                } else {
                    container.innerHTML = `
                        <div class="text-center py-10">
                            <p class="text-xl font-bold text-gray-700 mb-2">الحديث غير موجود</p>
                            <p class="text-gray-500">لم يتم العثور على المستند برقم: ${id}</p>
                            <button onclick="goBack()" class="mt-4 text-emerald-600 underline">عودة للنتائج</button>
                        </div>`;
                }
            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="text-center py-10 text-red-500">حدث خطأ أثناء التحميل.</div>';
            }
        }

        function renderHadithDetail(hadith) {
            const container = document.getElementById('detail-content');
            
            const formattedText = cleanText(hadith.text).split(/(?<=[.])\s+/).map(line => line.trim() ? `<p class="mb-4">${line}</p>` : '').join('');
            const formattedSharh = cleanText(hadith.sharh || '').split(/(?<=[.])\s+/).map(line => line.trim() ? `<p class="mb-4">${line}</p>` : '').join('');
            const formattedOsoul = cleanText(hadith.osoul || '').split(/(?<=[.])\s+/).map(line => line.trim() ? `<p class="mb-4">${line}</p>` : '').join('');

            const cats = Array.isArray(hadith.categories) ? hadith.categories : (hadith.categories ? [hadith.categories] : []);
            const rawis = Array.isArray(hadith.rawi) ? hadith.rawi : (hadith.rawi ? [hadith.rawi] : []);

            container.innerHTML = `
                <div class="px-2">
                    <div class="flex justify-between items-center mb-6 border-b border-gray-100 pb-2">
                        <span class="text-xs font-mono text-gray-300">ID: ${hadith.objectID}</span>
                        <div class="flex gap-2">
                            <button onclick="openEditModal()" class="flex items-center gap-2 text-gray-600 hover:text-emerald-800 text-sm font-bold bg-gray-50 px-4 py-1.5 rounded-full transition hover:bg-gray-100 border border-gray-200">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                تعديل
                            </button>
                            <button id="share-btn" onclick="copyLink('${hadith.objectID}')" class="flex items-center gap-2 text-emerald-600 hover:text-emerald-800 text-sm font-bold bg-emerald-50 px-4 py-1.5 rounded-full transition hover:bg-emerald-100">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                                مشاركة
                            </button>
                        </div>
                    </div>

                    <div class="text-center mb-8">
                        <div class="flex flex-wrap justify-center gap-2 mb-6 text-sm">
                             ${hadith.hukm ? `<span class="px-3 py-1 bg-gray-100 text-gray-700 rounded-lg border border-gray-200">الحكم: ${hadith.hukm}</span>` : ''}
                             ${hadith.source ? `<span class="px-3 py-1 bg-gray-100 text-gray-700 rounded-lg border border-gray-200">المصدر: ${hadith.source}</span>` : ''}
                             ${hadith.page_or_number ? `<span class="px-3 py-1 bg-gray-100 text-gray-700 rounded-lg border border-gray-200">رقم: ${hadith.page_or_number}</span>` : ''}
                        </div>
                        <div class="font-amiri text-gray-900 font-bold leading-loose text-justify px-2 content-scalable" style="font-size: ${currentFontSize}px">
                            ${formattedText}
                        </div>
                    </div>

                    <div class="border-t border-gray-100 pt-8 grid grid-cols-1 md:grid-cols-2 gap-6 text-lg">
                        <div class="border-b md:border-b-0 border-gray-50 pb-4">
                            <h3 class="text-emerald-700 font-bold text-base mb-2">الراوي</h3>
                            <div class="text-amber-900 font-amiri font-bold">
                                ${rawis.length ? rawis.join('، ') : '-'}
                            </div>
                        </div>
                         <div class="border-b md:border-b-0 border-gray-50 pb-4">
                            <h3 class="text-emerald-700 font-bold text-base mb-2">المحدث</h3>
                            <div class="text-amber-900 font-amiri font-bold">${hadith.muhaddith || '-'}</div>
                        </div>
                        <div class="md:col-span-2 border-b md:border-b-0 border-gray-50 pb-4">
                            <h3 class="text-emerald-700 font-bold text-base mb-2">التخريج</h3>
                            <div class="text-amber-900 font-amiri leading-relaxed">${hadith.takhrij || '-'}</div>
                        </div>
                        
                        ${cats.length ? `
                        <div class="md:col-span-2 pb-4">
                            <h3 class="text-emerald-700 font-bold text-base mb-3">التصنيفات</h3>
                            <div class="flex flex-wrap gap-2">
                                ${cats.map(c => `<button onclick="smartSearch('${c}')" class="text-xs bg-emerald-50 text-emerald-800 px-3 py-1 rounded-full hover:bg-emerald-100 border border-emerald-100">#${c}</button>`).join('')}
                            </div>
                        </div>` : ''}
                    </div>

                    <div class="mt-8 bg-gray-50 rounded-xl p-6 border border-gray-100">
                        <h3 class="text-xl font-bold font-amiri text-gray-800 mb-4 border-b border-gray-200 pb-2">الشرح</h3>
                        <div class="text-gray-700 font-amiri leading-loose content-scalable text-justify" style="font-size: ${currentFontSize - 2}px">
                            ${formattedSharh || 'لا يوجد شرح متوفر لهذا الحديث حالياً.'}
                        </div>
                    </div>

                    ${hadith.osoul ? `
                    <div class="mt-8 pt-6 border-t border-gray-100">
                        <h3 class="text-lg font-bold font-amiri text-gray-800 mb-2">أصل الحديث</h3>
                        <div class="text-gray-600 font-amiri leading-loose content-scalable text-justify" style="font-size: ${currentFontSize - 4}px">
                            ${formattedOsoul}
                        </div>
                    </div>` : ''}

                </div>
            `;
        }

        // ------------------------------------------
        // 8. EDIT MODAL LOGIC
        // ------------------------------------------
        function openEditModal() {
            if (!currentHadithData) return;
            const d = currentHadithData;
            
            const setVal = (id, val) => document.getElementById(id).value = val || '';
            const setArr = (id, val) => document.getElementById(id).value = Array.isArray(val) ? val.join('، ') : (val || '');
            const setMixed = (id, val) => document.getElementById(id).value = Array.isArray(val) ? val.join('، ') : (val || '');

            setVal('modal-id', d.objectID);
            setVal('modal-page', d.page_or_number);
            setVal('modal-text', d.text);
            
            setArr('modal-rawi', d.rawi);
            setMixed('modal-muhaddith', d.muhaddith);
            setMixed('modal-hukm', d.hukm);
            setMixed('modal-source', d.source);
            
            setArr('modal-categories', d.categories);
            setVal('modal-takhrij', d.takhrij);
            setVal('modal-sharh', d.sharh);
            setVal('modal-osoul', d.osoul);

            document.getElementById('edit-modal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('active');
        }

        async function saveFullEdit() {
            const btn = document.getElementById('modal-save-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> جاري الحفظ...`;
            btn.disabled = true;

            const parseArray = (val) => val ? val.split('،').join(',').split(',').map(s => s.trim()).filter(Boolean) : [];
            const docId = document.getElementById('modal-id').value;

            const newData = {
                text: document.getElementById('modal-text').value,
                rawi: parseArray(document.getElementById('modal-rawi').value),
                muhaddith: document.getElementById('modal-muhaddith').value,
                hukm: document.getElementById('modal-hukm').value,
                source: document.getElementById('modal-source').value,
                page_or_number: document.getElementById('modal-page').value,
                takhrij: document.getElementById('modal-takhrij').value,
                sharh: document.getElementById('modal-sharh').value,
                osoul: document.getElementById('modal-osoul').value,
                categories: parseArray(document.getElementById('modal-categories').value),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                await db.collection('hadiths').doc(docId).update(newData);
                
                // Update Local Data & UI Immediately
                currentHadithData = { ...currentHadithData, ...newData, objectID: docId };
                renderHadithDetail(currentHadithData);
                closeEditModal();
                
                // Show Success Toast (optional, for now just alert/log)
                // console.log("Saved successfully");

            } catch (error) {
                console.error("Error updating document: ", error);
                alert("فشل الحفظ: " + error.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // ------------------------------------------
        // 9. UTILS & HELPERS
        // ------------------------------------------
        function cleanText(text) {
            if (!text) return "";
            return String(text).replace(/([\])])(?=[^\s])/g, '$1 ').replace(/([^\s])(?=[\[(])/g, '$1 ');
        }

        function smartSearch(term) {
            goBack();
            const input = document.querySelector('#custom-search-input');
            const btn = document.querySelector('#custom-search-btn');
            if (input && btn) {
                input.value = term;
                btn.click();
            }
        }

        function changeFontSize(amount) {
            currentFontSize += amount;
            if (currentFontSize < 14) currentFontSize = 14;
            if (currentFontSize > 40) currentFontSize = 40;
            
            document.querySelectorAll('.content-scalable').forEach(el => {
                el.style.fontSize = currentFontSize + 'px';
            });
        }
    </script>
</body>
</html>
